name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26] # oldest supported and current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:qunit
      # UI5's own test files, downloaded by test:ui5 only if they are missing
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/lib/test/ui5native/upstream
          key: ui5-tests-${{ hashFiles('packages/lib/ui5.yaml', 'scripts/run-ui5-tests.mjs') }}
      - run: npm run test:ui5
