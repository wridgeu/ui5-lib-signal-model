<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" role="img" aria-labelledby="title desc">
  <title id="title">SignalModel vs JSONModel Performance Benchmark</title>
  <desc id="desc">Horizontal bar comparison of median latency (ms, lower is better) across key scenarios at 2,000 bindings, 500 iterations, 20 rounds on OpenUI5 1.154.0.</desc>
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .track { fill: #21262d; }
    .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .label { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .val { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .val-sig { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .badge-bg { fill: rgba(46, 160, 67, 0.16); }
    .badge-txt { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3fb950; }
    .badge-eq-bg { fill: rgba(139, 148, 158, 0.15); }
    .badge-eq-txt { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .bar-json { fill: #6e7681; }
    .bar-sig { fill: #2f81f7; }
    .foot { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .card { fill: #f6f8fa; stroke: #d0d7de; }
      .track { fill: #eaeef2; }
      .title { fill: #1f2328; }
      .sub { fill: #656d76; }
      .label { fill: #1f2328; }
      .val { fill: #656d76; }
      .val-sig { fill: #1f2328; }
      .badge-bg { fill: rgba(26, 127, 55, 0.12); }
      .badge-txt { fill: #1a7f37; }
      .badge-eq-bg { fill: rgba(101, 109, 118, 0.12); }
      .badge-eq-txt { fill: #656d76; }
      .bar-json { fill: #8c959f; }
      .bar-sig { fill: #0969da; }
      .foot { fill: #656d76; }
    }
  </style>

  <rect class="bg" width="760" height="472" rx="10" />
  <rect class="card" x="12" y="12" width="736" height="448" rx="8" />

  <!-- Header -->
  <text class="title" x="32" y="42">SignalModel vs JSONModel — Key Benchmark Scenarios</text>
  <text class="sub" x="32" y="60">2,000 bindings · 500 iterations · 20 alternating rounds · OpenUI5 1.154.0 · Median latency (lower is better)</text>

  <!-- Legend -->
  <rect class="bar-json" x="548" y="31" width="10" height="10" rx="2" />
  <text class="sub" x="564" y="40">JSONModel</text>
  <rect class="bar-sig" x="638" y="31" width="10" height="10" rx="2" />
  <text class="sub" x="654" y="40">SignalModel</text>

  <!-- Row 1: Update all 2000 bindings (sync) — scale: 1200ms = 590px -->
  <g transform="translate(32, 84)">
    <text class="label" x="0" y="12">#4  Update all 2,000 bindings (sync)</text>
    <rect class="badge-bg" x="598" y="0" width="98" height="17" rx="4" />
    <text class="badge-txt" x="647" y="12" text-anchor="middle">47.15x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="598" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">1195.35 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="13" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">25.35 ms</text>
  </g>

  <!-- Row 2: Real-world checkPerformanceOfUpdate — scale: 40ms = 600px -->
  <g transform="translate(32, 144)">
    <text class="label" x="0" y="12">#21 Real-world: checkPerformanceOfUpdate (3,449 bindings, 29 sync calls)</text>
    <rect class="badge-bg" x="604" y="0" width="92" height="17" rx="4" />
    <text class="badge-txt" x="650" y="12" text-anchor="middle">6.41x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="534" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">35.60 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="83" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">5.55 ms</text>
  </g>

  <!-- Row 3: Pinpoint merge 20k items — scale: 40ms = 600px -->
  <g transform="translate(32, 204)">
    <text class="label" x="0" y="12">#20 setData merge (large dataset, pinpoint: 3 into 20,000 items)</text>
    <rect class="badge-bg" x="604" y="0" width="92" height="17" rx="4" />
    <text class="badge-txt" x="650" y="12" text-anchor="middle">4.68x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="351" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">23.40 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="75" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">5.00 ms</text>
  </g>

  <!-- Row 4: Nested config merge — scale: 10ms = 600px -->
  <g transform="translate(32, 264)">
    <text class="label" x="0" y="12">#19 setData merge (nested config, 5 levels)</text>
    <rect class="badge-bg" x="604" y="0" width="92" height="17" rx="4" />
    <text class="badge-txt" x="650" y="12" text-anchor="middle">1.28x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="360" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">6.00 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="282" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">4.70 ms</text>
  </g>

  <!-- Row 5: Sparse async — scale: 10ms = 600px -->
  <g transform="translate(32, 324)">
    <text class="label" x="0" y="12">#6  Sparse async, 1 of 2,000 bindings (bAsyncUpdate=true)</text>
    <rect class="badge-bg" x="604" y="0" width="92" height="17" rx="4" />
    <text class="badge-txt" x="650" y="12" text-anchor="middle">1.14x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="315" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">5.25 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="276" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">4.60 ms</text>
  </g>

  <!-- Row 6: Update all 2000 (async) — scale: 40ms = 600px -->
  <g transform="translate(32, 384)">
    <text class="label" x="0" y="12">#5  Update all 2,000 bindings (bAsyncUpdate=true)</text>
    <rect class="badge-eq-bg" x="628" y="0" width="68" height="17" rx="4" />
    <text class="badge-eq-txt" x="662" y="12" text-anchor="middle">~equal</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="344" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">22.95 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="362" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">24.15 ms</text>
  </g>

  <text class="foot" x="32" y="446">All 22 scenarios: 9 faster, 13 ~equal, 0 slower. Bar widths are scaled per scenario group.</text>
</svg>
