<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" width="760" height="522" role="img" aria-labelledby="title desc">
  <title id="title">SignalModel vs JSONModel Performance Benchmark</title>
  <desc id="desc">Horizontal bar comparison of median time per operation (lower is better) for 6 of 24 scenarios at 2,000 bindings on OpenUI5 1.154.0, 10 runs in headless Chrome 158. Timed from the model write until the bound control is updated and UI5 has re-rendered its DOM. Browser layout and paint are not timed.</desc>
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .track { fill: #21262d; }
    .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .label { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .val { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .val-sig { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .badge-bg { fill: rgba(46, 160, 67, 0.16); }
    .badge-txt { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3fb950; }
    .badge-eq-bg { fill: rgba(139, 148, 158, 0.15); }
    .badge-eq-txt { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .bar-json { fill: #6e7681; }
    .bar-sig { fill: #2f81f7; }
    .foot { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .card { fill: #f6f8fa; stroke: #d0d7de; }
      .track { fill: #eaeef2; }
      .title { fill: #1f2328; }
      .sub { fill: #656d76; }
      .label { fill: #1f2328; }
      .val { fill: #656d76; }
      .val-sig { fill: #1f2328; }
      .badge-bg { fill: rgba(26, 127, 55, 0.12); }
      .badge-txt { fill: #1a7f37; }
      .badge-eq-bg { fill: rgba(101, 109, 118, 0.12); }
      .badge-eq-txt { fill: #656d76; }
      .bar-json { fill: #8c959f; }
      .bar-sig { fill: #0969da; }
      .foot { fill: #656d76; }
    }
  </style>

  <rect class="bg" width="760" height="522" rx="10" />
  <rect class="card" x="12" y="12" width="736" height="498" rx="8" />

  <text class="title" x="32" y="42">SignalModel vs JSONModel — Key Benchmark Scenarios</text>
  <text class="sub" x="32" y="60">2,000 bindings · OpenUI5 1.154.0 · headless Chrome 158 · median time per operation over 10 runs (lower is better)</text>

  <rect class="bar-json" x="548" y="31" width="10" height="10" rx="2" />
  <text class="sub" x="564" y="40">JSONModel</text>
  <rect class="bar-sig" x="638" y="31" width="10" height="10" rx="2" />
  <text class="sub" x="654" y="40">SignalModel</text>

  <g transform="translate(32, 84)">
    <text class="label" x="0" y="12">#4 Update all 2000 bindings (sync)</text>
    <rect class="badge-bg" x="548" y="0" width="148" height="17" rx="4" />
    <text class="badge-txt" x="622" y="12" text-anchor="middle">59x faster (57x-60x)</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">1025 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="10" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">17.34 ms</text>
  </g>

  <g transform="translate(32, 144)">
    <text class="label" x="0" y="12">#21 Warning threshold: 29 sync calls, 3449 bindings</text>
    <rect class="badge-bg" x="541" y="0" width="155" height="17" rx="4" />
    <text class="badge-txt" x="618.5" y="12" text-anchor="middle">98x faster (95x-100x)</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">26.50 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="6" height="10" rx="1.5" />
    <text class="val-sig" x="696" y="44" text-anchor="end">0.269 ms</text>
  </g>

  <g transform="translate(32, 204)">
    <text class="label" x="0" y="12">#3 Single-path update, 2000 bindings</text>
    <rect class="badge-bg" x="548" y="0" width="148" height="17" rx="4" />
    <text class="badge-txt" x="622" y="12" text-anchor="middle">55x faster (54x-56x)</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">0.537 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="11" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">9.9 µs</text>
  </g>

  <g transform="translate(32, 264)">
    <text class="label" x="0" y="12">#20 setData merge (large, pinpoint), 20000 items</text>
    <rect class="badge-bg" x="528" y="0" width="168" height="17" rx="4" />
    <text class="badge-txt" x="612" y="12" text-anchor="middle">560x faster (550x-570x)</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">17.90 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="3" height="10" rx="1.5" />
    <text class="val-sig" x="696" y="44" text-anchor="end">31.9 µs</text>
  </g>

  <g transform="translate(32, 324)">
    <text class="label" x="0" y="12">#6 Sparse update, 1 of 2000 (bAsyncUpdate)</text>
    <rect class="badge-bg" x="548" y="0" width="148" height="17" rx="4" />
    <text class="badge-txt" x="622" y="12" text-anchor="middle">32x faster (31x-32x)</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">0.541 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="19" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">17.2 µs</text>
  </g>

  <g transform="translate(32, 384)">
    <text class="label" x="0" y="12">#5 Update all 2000 bindings (bAsyncUpdate)</text>
    <rect class="badge-eq-bg" x="434" y="0" width="262" height="17" rx="4" />
    <text class="badge-eq-txt" x="565" y="12" text-anchor="middle">marginally faster 1.01x (1.00x-1.02x)</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">17.08 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="584" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">16.91 ms</text>
  </g>

  <text class="foot" x="32" y="448">Timed: model write → bound control updated → UI5 re-renders the DOM. Bars are scaled per scenario.</text>
  <text class="foot" x="32" y="464">Not timed: browser layout and paint (hidden container), and the setTimeout(0) UI5 waits before rendering.</text>
  <text class="foot" x="32" y="480">Ranges: 95% confidence interval of JSONModel time / SignalModel time over 10 runs; below 1x means SignalModel is slower.</text>
  <text class="foot" x="32" y="496">All 24 scenarios: 20 faster, 1 slower, 3 no clear difference. Measured on one machine.</text>
</svg>
