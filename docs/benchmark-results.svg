<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="title desc">
  <title id="title">SignalModel vs JSONModel Performance Benchmark</title>
  <desc id="desc">Horizontal bar comparison of median time per operation (lower is better) across key scenarios at 2,000 bindings on OpenUI5 1.154.0, median of 4 runs. Measures model to control propagation; DOM rendering is excluded.</desc>
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .track { fill: #21262d; }
    .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .label { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .val { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .val-sig { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .badge-bg { fill: rgba(46, 160, 67, 0.16); }
    .badge-txt { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3fb950; }
    .badge-eq-bg { fill: rgba(139, 148, 158, 0.15); }
    .badge-eq-txt { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .bar-json { fill: #6e7681; }
    .bar-sig { fill: #2f81f7; }
    .foot { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .card { fill: #f6f8fa; stroke: #d0d7de; }
      .track { fill: #eaeef2; }
      .title { fill: #1f2328; }
      .sub { fill: #656d76; }
      .label { fill: #1f2328; }
      .val { fill: #656d76; }
      .val-sig { fill: #1f2328; }
      .badge-bg { fill: rgba(26, 127, 55, 0.12); }
      .badge-txt { fill: #1a7f37; }
      .badge-eq-bg { fill: rgba(101, 109, 118, 0.12); }
      .badge-eq-txt { fill: #656d76; }
      .bar-json { fill: #8c959f; }
      .bar-sig { fill: #0969da; }
      .foot { fill: #656d76; }
    }
  </style>

  <rect class="bg" width="760" height="490" rx="10" />
  <rect class="card" x="12" y="12" width="736" height="466" rx="8" />

  <!-- Header -->
  <text class="title" x="32" y="42">SignalModel vs JSONModel — Key Benchmark Scenarios</text>
  <text class="sub" x="32" y="60">2,000 bindings · median of 4 runs × 10 samples per model · OpenUI5 1.154.0 · time per operation (lower is better)</text>

  <!-- Legend -->
  <rect class="bar-json" x="548" y="31" width="10" height="10" rx="2" />
  <text class="sub" x="564" y="40">JSONModel</text>
  <rect class="bar-sig" x="638" y="31" width="10" height="10" rx="2" />
  <text class="sub" x="654" y="40">SignalModel</text>

  <!-- Row 1: scenario 4, bars scaled to 1161 ms = 590px -->
  <g transform="translate(32, 84)">
    <text class="label" x="0" y="12">#4  Update all 2,000 bindings (sync, 2,000 setProperty calls)</text>
    <rect class="badge-bg" x="608" y="0" width="88" height="17" rx="4" />
    <text class="badge-txt" x="652" y="12" text-anchor="middle">376x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">1161 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="3" height="10" rx="1.5" />
    <text class="val-sig" x="696" y="44" text-anchor="end">3.09 ms</text>
  </g>

  <!-- Row 2: scenario 21, bars scaled to 28.42 ms = 590px -->
  <g transform="translate(32, 144)">
    <text class="label" x="0" y="12">#21 Real-world: checkPerformanceOfUpdate (3,449 bindings, 29 sync calls)</text>
    <rect class="badge-bg" x="608" y="0" width="88" height="17" rx="4" />
    <text class="badge-txt" x="652" y="12" text-anchor="middle">541x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">28.42 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="3" height="10" rx="1.5" />
    <text class="val-sig" x="696" y="44" text-anchor="end">52.6 µs</text>
  </g>

  <!-- Row 3: scenario 3, bars scaled to 0.760 ms = 590px -->
  <g transform="translate(32, 204)">
    <text class="label" x="0" y="12">#3  Single-path update, 1 of 2,000 bindings (sync)</text>
    <rect class="badge-bg" x="608" y="0" width="88" height="17" rx="4" />
    <text class="badge-txt" x="652" y="12" text-anchor="middle">286x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">0.760 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="3" height="10" rx="1.5" />
    <text class="val-sig" x="696" y="44" text-anchor="end">2.7 µs</text>
  </g>

  <!-- Row 4: scenario 20, bars scaled to 24.72 ms = 590px -->
  <g transform="translate(32, 264)">
    <text class="label" x="0" y="12">#20 setData merge (large dataset, pinpoint: 3 into 20,000 items)</text>
    <rect class="badge-bg" x="602" y="0" width="94" height="17" rx="4" />
    <text class="badge-txt" x="649" y="12" text-anchor="middle">3129x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">24.72 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="3" height="10" rx="1.5" />
    <text class="val-sig" x="696" y="44" text-anchor="end">7.9 µs</text>
  </g>

  <!-- Row 5: scenario 6, bars scaled to 0.774 ms = 590px -->
  <g transform="translate(32, 324)">
    <text class="label" x="0" y="12">#6  Sparse async, 1 of 2,000 bindings (bAsyncUpdate=true)</text>
    <rect class="badge-bg" x="602" y="0" width="94" height="17" rx="4" />
    <text class="badge-txt" x="649" y="12" text-anchor="middle">34.2x faster</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="590" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">0.774 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="17" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">22.6 µs</text>
  </g>

  <!-- Row 6: scenario 5, bars scaled to 12.57 ms = 590px -->
  <g transform="translate(32, 384)">
    <text class="label" x="0" y="12">#5  Update all 2,000 bindings (bAsyncUpdate=true)</text>
    <rect class="badge-eq-bg" x="628" y="0" width="68" height="17" rx="4" />
    <text class="badge-eq-txt" x="662" y="12" text-anchor="middle">~equal</text>
    <rect class="track" x="0" y="21" width="600" height="10" rx="4" />
    <rect class="bar-json" x="0" y="21" width="513" height="10" rx="4" />
    <text class="val" x="696" y="30" text-anchor="end">10.93 ms</text>
    <rect class="track" x="0" y="35" width="600" height="10" rx="4" />
    <rect class="bar-sig" x="0" y="35" width="590" height="10" rx="4" />
    <text class="val-sig" x="696" y="44" text-anchor="end">12.57 ms</text>
  </g>

  <text class="foot" x="32" y="448">All 22 scenarios: 15 faster, 7 ~equal, 0 slower (verdicts stable across 4 runs). Bar widths are scaled per scenario.</text>
  <text class="foot" x="32" y="464">Measures model → binding → control propagation. DOM rendering is excluded, so end-to-end UI gains are smaller.</text>
</svg>
